<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>D&D 2024 - Sorts</title>
    <link href="https://fonts.googleapis.com/css?family=Noto+Sans:400,700" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css?family=Lora:700" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/catalog.css" />
    <link rel="preload" href="data/spells_2024.json" as="fetch" type="application/json" crossorigin="anonymous" />
    <script src="js/user-library.js" defer></script>
    <script src="js/site-shell.js" defer></script>
    <script src="js/rich-html.js" defer></script>
    <script src="js/spell-export.js" defer></script>
    <script src="js/spell-filters.js" defer></script>
    <script src="js/catalog-ui.js" defer></script>
    <script src="js/progressive-list.js" defer></script>
    <script src="js/spells-page.js" defer></script>
</head>
<body class="catalog-page" data-library-title="Sorts D&D 2024" data-library-category="Catalogue" data-library-description="Les 391 sorts de la version 2024">
    <a class="skip-link" href="#main-content">Aller au contenu</a>
    <header data-site-header data-active="spells">
        <nav class="fallback-navigation" aria-label="Navigation de secours"><a href="index.html">Accueil</a></nav>
    </header>

    <main class="catalog-main" id="main-content">
        <section class="catalog-header" aria-labelledby="catalog-title">
            <div>
                <p class="catalog-header__eyebrow">Grimoire des arcanes</p>
                <h1 id="catalog-title">Sorts D&D 2024</h1>
                <p id="sourceNote">Chargement des sorts...</p>
            </div>
            <span class="catalog-header__stat">391 sorts officiels</span>
        </section>

        <section class="catalog-toolbar" aria-label="Recherche dans les sorts">
            <div class="catalog-search">
                <label class="visually-hidden" for="searchInput">Rechercher par nom, école ou description</label>
                <span class="catalog-search__icon" aria-hidden="true">⌕</span>
                <input id="searchInput" data-page-search type="search" autocomplete="off" placeholder="Rechercher un sort, une école, un effet…" />
                <kbd aria-hidden="true">/</kbd>
            </div>
            <div class="catalog-toolbar__bottom">
                <div class="catalog-toolbar__mobile-actions">
                    <button class="catalog-mobile-button" id="openFiltersBtn" type="button">Filtres <span id="activeFilterCount">0</span></button>
                    <button class="catalog-mobile-button" id="openSortBtn" type="button">Trier</button>
                </div>
                <span class="catalog-summary" id="summary" aria-live="polite"></span>
            </div>
        </section>

        <div class="active-filters" id="activeFilters" aria-label="Filtres actifs" hidden></div>

        <div class="catalog-layout">
            <aside class="catalog-filters" id="filterPanel" aria-labelledby="filter-title">
                <div class="catalog-filters__header">
                    <h2 id="filter-title">Affiner les résultats</h2>
                    <button class="icon-button catalog-filters__close" id="closeFiltersBtn" type="button" aria-label="Fermer les filtres">×</button>
                </div>
                <div class="catalog-filters__body">
                    <div class="filter-group">
                        <label for="levelSelect">Niveau</label>
                        <select id="levelSelect">
                            <option value="">Tous les niveaux</option>
                            <option value="0">Tour de magie</option>
                            <option value="1">Niveau 1</option>
                            <option value="2">Niveau 2</option>
                            <option value="3">Niveau 3</option>
                            <option value="4">Niveau 4</option>
                            <option value="5">Niveau 5</option>
                            <option value="6">Niveau 6</option>
                            <option value="7">Niveau 7</option>
                            <option value="8">Niveau 8</option>
                            <option value="9">Niveau 9</option>
                        </select>
                    </div>

                    <div class="filter-group" role="group" aria-labelledby="classes-label">
                        <span class="filter-group__label" id="classes-label">Classes — au moins une</span>
                        <div class="class-list" id="classList"></div>
                    </div>

                    <div class="filter-group">
                        <label for="sortSelect">Trier par</label>
                        <select id="sortSelect">
                            <option value="level_asc">Niveau croissant</option>
                            <option value="level_desc">Niveau décroissant</option>
                            <option value="name_asc">Nom A–Z</option>
                            <option value="name_desc">Nom Z–A</option>
                        </select>
                    </div>

                    <button class="catalog-reset" id="resetFiltersBtn" type="button">Réinitialiser les filtres</button>
                </div>
            </aside>

            <button class="catalog-filter-backdrop" id="filterBackdrop" type="button" aria-label="Fermer les filtres"></button>

            <section class="catalog-results" aria-label="Résultats">
                <div class="catalog-results__tools">
                    <span class="catalog-results__status" id="exportStatus" aria-live="polite"></span>
                    <button class="button" id="expandAllBtn" type="button">Tout ouvrir</button>
                    <button class="button" id="collapseAllBtn" type="button">Tout fermer</button>
                    <button class="button" id="exportTxtBtn" type="button" disabled>Exporter (.txt)</button>
                </div>
                <div class="catalog-grid" id="spellsGrid"></div>
                <button class="progressive-load-more" id="loadMoreBtn" type="button" hidden></button>
            </section>
        </div>
    </main>
</body>
</html>
