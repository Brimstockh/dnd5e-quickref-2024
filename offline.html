<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d0c0a">
    <meta name="robots" content="noindex">
    <title>Hors connexion · D&D 2024</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/icons/pwa-192.png">
    <style>
        :root {
            color-scheme: dark;
            font-family: "Segoe UI", system-ui, sans-serif;
            color: #eee8dc;
            background: #0d0c0a;
        }
        * { box-sizing: border-box; }
        body {
            min-width: 320px;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            margin: 0;
            padding: 1.5rem;
            background:
                radial-gradient(circle at 50% 15%, rgb(185 151 86 / 14%), transparent 22rem),
                #0d0c0a;
        }
        main {
            width: min(100%, 34rem);
            padding: clamp(1.5rem, 6vw, 3rem);
            text-align: center;
            background: #15130f;
            border: 1px solid #53442f;
            border-radius: 0.75rem;
            box-shadow: 0 1rem 3rem rgb(0 0 0 / 30%);
        }
        img { width: 7rem; height: 7rem; }
        h1 {
            margin: 1rem 0 0.75rem;
            color: #d2b374;
            font-family: Georgia, serif;
            font-size: clamp(1.8rem, 7vw, 2.6rem);
        }
        p { margin: 0; color: #b3a692; line-height: 1.6; }
        nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.75rem;
            margin-top: 1.75rem;
        }
        a,
        button {
            min-height: 2.75rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.65rem 1rem;
            color: #eee8dc;
            font: inherit;
            font-weight: 650;
            text-decoration: none;
            background: #242018;
            border: 1px solid #735b31;
            border-radius: 0.4rem;
            cursor: pointer;
        }
        button { color: #17120b; background: #d2b374; }
        a:focus-visible,
        button:focus-visible { outline: 3px solid #f0cf87; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <img src="assets/icons/pwa-192.png" alt="">
        <h1>Vous êtes hors connexion</h1>
        <p>Les pages déjà consultées et la référence essentielle restent disponibles. Reconnectez-vous pour charger un contenu qui ne serait pas encore enregistré.</p>
        <nav aria-label="Actions hors connexion">
            <button type="button" onclick="window.location.reload()">Réessayer</button>
            <a href="index.html">Retour à l’accueil</a>
        </nav>
    </main>
    <script src="js/pwa-client.js"></script>
</body>
</html>
