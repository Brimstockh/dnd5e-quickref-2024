<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>D&D 2024 - Dons</title>
    <link href="https://fonts.googleapis.com/css?family=Noto+Sans:400,700" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css?family=Lora:700" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/catalog.css" />
    <link rel="preload" href="data/feats_2024.json" as="fetch" type="application/json" crossorigin="anonymous" />
    <script src="js/user-library.js" defer></script>
    <script src="js/site-shell.js" defer></script>
    <script src="js/catalog-ui.js" defer></script>
    <script src="js/feats-page.js" defer></script>
</head>
<body class="catalog-page" data-library-title="Dons" data-library-category="Catalogue" data-library-description="Catalogue des dons D&D 2024">
    <a class="skip-link" href="#main-content">Aller au contenu</a>
    <header data-site-header data-active="feats">
        <nav class="fallback-navigation" aria-label="Navigation de secours"><a href="index.html">Accueil</a></nav>
    </header>
    <main class="catalog-main" id="main-content" data-glossary-richtext>

        <section class="page-feature page-feature--creation page-feature--compact" aria-labelledby="feats-title">
            <div class="page-feature__content">
                <span class="section-visual__icon page-feature__icon" aria-hidden="true"><svg class="icon" viewBox="0 0 64 64" focusable="false"><use href="assets/icons/site-icons.svg#feats"></use></svg></span>
                <p class="page-feature__eyebrow">Création</p>
                <h1 id="feats-title">Dons</h1>
                <p class="page-feature__description">Explorez les dons qui spécialisent et développent les capacités de votre personnage.</p>
                <p class="page-feature__meta" id="sourceNote" aria-live="polite">Chargement des dons...</p>
            </div>
        </section>

        <section class="catalog-toolbar" aria-label="Recherche dans les dons">
            <div class="catalog-search">
                <label class="visually-hidden" for="searchInput">Rechercher par nom, catégorie ou description</label>
                <span class="catalog-search__icon" aria-hidden="true">⌕</span>
                <input id="searchInput" data-page-search type="search" autocomplete="off" placeholder="Nom, catégorie, prérequis…" />
                <kbd aria-hidden="true">/</kbd>
            </div>
            <div class="catalog-toolbar__bottom">
                <div class="catalog-toolbar__mobile-actions">
                    <button class="catalog-mobile-button" id="openFiltersBtn" type="button">Filtres <span id="activeFilterCount">0</span></button>
                </div>
                <span class="catalog-summary" id="summary" role="status" aria-live="polite"></span>
            </div>
        </section>

        <div class="active-filters" id="activeFilters" aria-label="Filtres actifs" hidden></div>

        <div class="catalog-layout">
            <aside class="catalog-filters" id="filterPanel" aria-labelledby="filter-title">
                <div class="catalog-filters__header">
                    <h2 id="filter-title">Affiner les résultats</h2>
                    <button class="catalog-mobile-button catalog-filters__close" id="closeFiltersBtn" type="button">Fermer</button>
                </div>
                <div class="catalog-filters__body">
                    <div class="filter-group">
                        <label for="categorySelect">Catégorie</label>
                        <select id="categorySelect">
                            <option value="">Toutes</option>
                            <option value="Don d’origines">Don d’origines</option>
                            <option value="Don général">Don général</option>
                            <option value="Don de Style de combat">Don de Style de combat</option>
                            <option value="Don de faveur épique">Don de faveur épique</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="prereqSelect">Prérequis</label>
                        <select id="prereqSelect">
                            <option value="">Tous</option>
                            <option value="yes">Avec prérequis</option>
                            <option value="no">Sans prérequis</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="repeatableSelect">Répétable</label>
                        <select id="repeatableSelect">
                            <option value="">Tous</option>
                            <option value="yes">Répétables</option>
                            <option value="no">Non répétables</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="sortSelect">Trier par</label>
                        <select id="sortSelect">
                            <option value="name_asc">Nom A–Z</option>
                            <option value="name_desc">Nom Z–A</option>
                            <option value="category_asc">Catégorie</option>
                            <option value="repeatable_desc">Répétables d’abord</option>
                            <option value="prereq_desc">Prérequis d’abord</option>
                        </select>
                    </div>
                    <button class="catalog-reset" id="resetFiltersBtn" type="button">Réinitialiser les filtres</button>
                </div>
            </aside>

            <button class="catalog-filter-backdrop" id="filterBackdrop" type="button" aria-label="Fermer les filtres"></button>

            <section class="catalog-results" aria-label="Résultats">
                <div class="catalog-results__tools">
                    <button class="button" id="expandAllBtn" type="button">Tout ouvrir</button>
                    <button class="button" id="collapseAllBtn" type="button">Tout fermer</button>
                </div>
                <div id="featsGrid" class="catalog-grid"></div>
            </section>
        </div>
    </main>
</body>
</html>
