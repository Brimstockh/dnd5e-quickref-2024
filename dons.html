<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>D&D 2024 - Dons</title>
    <link href="https://fonts.googleapis.com/css?family=Noto+Sans:400,700" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css?family=Lora:700" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --bg: #f1ece3;
            --paper: #fffef9;
            --ink: #222;
            --accent: #7a120f;
            --line: #d8d2c5;
            --muted: #5f5f5f;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Noto Sans", "Segoe UI", sans-serif;
            color: var(--ink);
            background: linear-gradient(160deg, #efe7d2 0%, #f8f5eb 45%, #ece6d8 100%);
        }

        .wrap {
            max-width: 1220px;
            margin: 0 auto;
            padding: 14px;
        }

        .topnav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .topnav a {
            text-decoration: none;
            border: 1px solid var(--accent);
            border-radius: 8px;
            color: var(--accent);
            background: #fff;
            padding: 7px 10px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .hero {
            background: var(--paper);
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .hero h1 {
            margin: 0 0 5px;
            color: var(--accent);
            font-family: "Lora", serif;
            font-size: 1.5rem;
        }

        .hero p {
            margin: 0;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .filters {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px;
            display: grid;
            gap: 8px;
            grid-template-columns: 2fr 1.2fr 1fr 1fr 1fr;
            margin-bottom: 10px;
        }

        .filters label {
            display: block;
            font-size: 0.74rem;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 4px;
            font-weight: 700;
            letter-spacing: 0.03em;
        }

        .filters input,
        .filters select {
            width: 100%;
            border: 1px solid #cabfae;
            border-radius: 8px;
            padding: 8px;
            font: inherit;
            background: #fff;
        }

        .summary {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .list-tools {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .list-tools button {
            border: 1px solid var(--accent);
            background: #fff;
            color: var(--accent);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 8px;
        }

        .feat {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 10px;
            overflow: hidden;
        }

        .feat-head {
            padding: 9px 10px;
            background: #f8f3f2;
            border-bottom: 1px solid var(--line);
        }

        details.feat > summary {
            list-style: none;
            cursor: pointer;
        }

        details.feat > summary::-webkit-details-marker {
            display: none;
        }

        details.feat > summary .feat-head {
            position: relative;
            padding-right: 34px;
        }

        details.feat > summary .feat-head::after {
            content: "+";
            position: absolute;
            right: 10px;
            top: 10px;
            color: var(--accent);
            font-weight: 700;
            font-size: 1.05rem;
            line-height: 1;
        }

        details.feat[open] > summary .feat-head::after {
            content: "−";
        }

        .feat-title {
            margin: 0;
            color: var(--accent);
            font-family: "Lora", serif;
            font-size: 1rem;
        }

        .feat-meta {
            color: var(--muted);
            font-size: 0.85rem;
            margin-top: 3px;
        }

        .feat-body {
            padding: 9px 10px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .feat-body p {
            margin: 0 0 8px;
        }

        .feat-body p:last-child {
            margin-bottom: 0;
        }

        .feat-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 0 0 8px;
            font-size: 0.88rem;
            background: #fff;
        }

        .feat-body th,
        .feat-body td {
            border: 1px solid var(--line);
            padding: 6px 8px;
            text-align: left;
            vertical-align: top;
        }

        .feat-body th {
            background: #f7f2e9;
            color: var(--accent);
        }

        .aliases {
            margin: 0 0 8px;
            color: var(--muted);
            font-size: 0.84rem;
        }

        .empty {
            background: var(--paper);
            border: 1px dashed var(--line);
            border-radius: 10px;
            padding: 14px;
            color: var(--muted);
        }

        @media (max-width: 1000px) {
            .filters {
                grid-template-columns: 1fr;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <nav class="topnav">
            <a href="index.html">Accueil</a>
            <a href="historique.html">Historiques</a>
            <a href="races/index.html">Races</a>
            <a href="classes/index.html">Classes</a>
            <a href="dons.html">Dons</a>
            <a href="rules-2024.html">Règles</a>
            <a href="combat-2024.html">Combats</a>
            <a href="mastery-2024.html">Maîtrise</a>
            <a href="spells.html">Sorts</a>
            <a href="monstres.html">Monstres</a>
            <a href="character-sheet-standalone.html">Modèle</a>
            <a href="quickref.html">Référence rapide</a>
        </nav>

        <section class="hero">
            <h1>Dons D&amp;D 2024</h1>
            <p id="sourceNote">Chargement des dons...</p>
        </section>

        <section class="filters">
            <div>
                <label for="searchInput">Recherche</label>
                <input id="searchInput" type="text" placeholder="Ex: magie, bouclier, télépathie..." />
            </div>
            <div>
                <label for="categorySelect">Catégorie</label>
                <select id="categorySelect">
                    <option value="">Toutes</option>
                    <option value="Don d’origines">Don d’origines</option>
                    <option value="Don général">Don général</option>
                    <option value="Don de Style de combat">Don de Style de combat</option>
                    <option value="Don de faveur épique">Don de faveur épique</option>
                </select>
            </div>
            <div>
                <label for="prereqSelect">Prérequis</label>
                <select id="prereqSelect">
                    <option value="">Tous</option>
                    <option value="yes">Avec prérequis</option>
                    <option value="no">Sans prérequis</option>
                </select>
            </div>
            <div>
                <label for="repeatableSelect">Répétable</label>
                <select id="repeatableSelect">
                    <option value="">Tous</option>
                    <option value="yes">Répétables</option>
                    <option value="no">Non répétables</option>
                </select>
            </div>
            <div>
                <label for="sortSelect">Tri</label>
                <select id="sortSelect">
                    <option value="name_asc">Nom A-Z</option>
                    <option value="name_desc">Nom Z-A</option>
                    <option value="category_asc">Catégorie</option>
                    <option value="repeatable_desc">Répétables d'abord</option>
                    <option value="prereq_desc">Prérequis d'abord</option>
                </select>
            </div>
        </section>

        <div class="list-tools">
            <button id="expandAllBtn" type="button">Tout ouvrir</button>
            <button id="collapseAllBtn" type="button">Tout fermer</button>
        </div>
        <div id="summary" class="summary"></div>
        <div id="featsGrid" class="grid"></div>
    </div>

    <script src="data/feats_2024.js"></script>
    <script src="js/feats-page.js"></script>
</body>
</html>
