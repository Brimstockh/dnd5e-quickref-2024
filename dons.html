<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>D&D 2024 - Dons</title>
    <link href="https://fonts.googleapis.com/css?family=Noto+Sans:400,700" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css?family=Lora:700" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/legacy-catalog.css" />
    <link rel="preload" href="data/feats_2024.json" as="fetch" type="application/json" crossorigin="anonymous" />
    <script src="js/user-library.js" defer></script>
    <script src="js/site-shell.js" defer></script>
    <script src="js/catalog-ui.js" defer></script>
    <script src="js/legacy-catalog-ui.js" defer></script>
    <script src="js/feats-page.js" defer></script>
</head>
<body class="legacy-catalog-page" data-library-title="Dons" data-library-category="Catalogue" data-library-description="Catalogue des dons D&D 2024">
    <a class="skip-link" href="#main-content">Aller au contenu</a>
    <header data-site-header data-active="feats"></header>
    <main class="wrap" id="main-content" data-glossary-richtext>
        <nav class="topnav">
            <a href="index.html">Accueil</a>
            <a href="historique.html">Historiques</a>
            <a href="races/index.html">Races</a>
            <a href="classes/index.html">Classes</a>
            <a href="dons.html">Dons</a>
            <a href="rules-2024.html">Règles</a>
            <a href="combat-2024.html">Combats</a>
            <a href="mastery-2024.html">Maîtrise</a>
            <a href="spells.html">Sorts</a>
            <a href="monstres.html">Monstres</a>
            <a href="character-sheet-standalone.html">Modèle</a>
            <a href="quickref.html">Référence rapide</a>
        </nav>

        <section class="page-feature page-feature--creation page-feature--compact" aria-labelledby="feats-title">
            <div class="page-feature__content">
                <span class="section-visual__icon page-feature__icon" aria-hidden="true"><svg class="icon" viewBox="0 0 64 64" focusable="false"><use href="assets/icons/site-icons.svg#feats"></use></svg></span>
                <p class="page-feature__eyebrow">Création</p>
                <h1 id="feats-title">Dons</h1>
                <p class="page-feature__description">Explorez les dons qui spécialisent et développent les capacités de votre personnage.</p>
                <p class="page-feature__meta" id="sourceNote" aria-live="polite">Chargement des dons...</p>
            </div>
        </section>

        <section class="filters">
            <div>
                <label for="searchInput">Recherche</label>
                <input id="searchInput" type="search" data-page-search placeholder="Ex: magie, bouclier, télépathie..." />
            </div>
            <div>
                <label for="categorySelect">Catégorie</label>
                <select id="categorySelect">
                    <option value="">Toutes</option>
                    <option value="Don d’origines">Don d’origines</option>
                    <option value="Don général">Don général</option>
                    <option value="Don de Style de combat">Don de Style de combat</option>
                    <option value="Don de faveur épique">Don de faveur épique</option>
                </select>
            </div>
            <div>
                <label for="prereqSelect">Prérequis</label>
                <select id="prereqSelect">
                    <option value="">Tous</option>
                    <option value="yes">Avec prérequis</option>
                    <option value="no">Sans prérequis</option>
                </select>
            </div>
            <div>
                <label for="repeatableSelect">Répétable</label>
                <select id="repeatableSelect">
                    <option value="">Tous</option>
                    <option value="yes">Répétables</option>
                    <option value="no">Non répétables</option>
                </select>
            </div>
            <div>
                <label for="sortSelect">Tri</label>
                <select id="sortSelect">
                    <option value="name_asc">Nom A-Z</option>
                    <option value="name_desc">Nom Z-A</option>
                    <option value="category_asc">Catégorie</option>
                    <option value="repeatable_desc">Répétables d'abord</option>
                    <option value="prereq_desc">Prérequis d'abord</option>
                </select>
            </div>
        </section>

        <div class="list-tools">
            <button id="expandAllBtn" type="button">Tout ouvrir</button>
            <button id="collapseAllBtn" type="button">Tout fermer</button>
        </div>
        <div id="summary" class="summary" role="status" aria-live="polite"></div>
        <div id="featsGrid" class="grid"></div>
    </main>
</body>
</html>
