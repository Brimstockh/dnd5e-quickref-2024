<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>D&D 2024 - Dons</title>
    <link href="https://fonts.googleapis.com/css?family=Noto+Sans:400,700" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css?family=Lora:700" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --bg: #f1ece3;
            --paper: #fffef9;
            --ink: #222;
            --accent: #7a120f;
            --line: #d8d2c5;
            --muted: #5f5f5f;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Noto Sans", "Segoe UI", sans-serif;
            color: var(--ink);
            background: linear-gradient(160deg, #efe7d2 0%, #f8f5eb 45%, #ece6d8 100%);
        }

        .wrap {
            max-width: 1220px;
            margin: 0 auto;
            padding: 14px;
        }

        .topnav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .topnav a {
            text-decoration: none;
            border: 1px solid var(--accent);
            border-radius: 8px;
            color: var(--accent);
            background: #fff;
            padding: 7px 10px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .hero {
            background: var(--paper);
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .hero h1 {
            margin: 0 0 5px;
            color: var(--accent);
            font-family: "Lora", serif;
            font-size: 1.5rem;
        }

        .hero p {
            margin: 0;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .filters {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px;
            display: grid;
            gap: 8px;
            grid-template-columns: 2fr 1.2fr 1fr 1fr 1fr;
            margin-bottom: 10px;
        }

        .filters label {
            display: block;
            font-size: 0.74rem;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 4px;
            font-weight: 700;
            letter-spacing: 0.03em;
        }

        .filters input,
        .filters select {
            width: 100%;
            border: 1px solid #cabfae;
            border-radius: 8px;
            padding: 8px;
            font: inherit;
            background: #fff;
        }

        .summary {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .list-tools {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .list-tools button {
            border: 1px solid var(--accent);
            background: #fff;
            color: var(--accent);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 8px;
        }

        .feat {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 10px;
            overflow: hidden;
        }

        .feat-head {
            padding: 9px 10px;
            background: #f8f3f2;
            border-bottom: 1px solid var(--line);
        }

        details.feat > summary {
            list-style: none;
            cursor: pointer;
        }

        details.feat > summary::-webkit-details-marker {
            display: none;
        }

        details.feat > summary .feat-head {
            position: relative;
            padding-right: 34px;
        }

        details.feat > summary .feat-head::after {
            content: "+";
            position: absolute;
            right: 10px;
            top: 10px;
            color: var(--accent);
            font-weight: 700;
            font-size: 1.05rem;
            line-height: 1;
        }

        details.feat[open] > summary .feat-head::after {
            content: "−";
        }

        .feat-title {
            margin: 0;
            color: var(--accent);
            font-family: "Lora", serif;
            font-size: 1rem;
        }

        .feat-meta {
            color: var(--muted);
            font-size: 0.85rem;
            margin-top: 3px;
        }

        .feat-body {
            padding: 9px 10px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .feat-body p {
            margin: 0 0 8px;
        }

        .feat-body p:last-child {
            margin-bottom: 0;
        }

        .feat-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 0 0 8px;
            font-size: 0.88rem;
            background: #fff;
        }

        .feat-body th,
        .feat-body td {
            border: 1px solid var(--line);
            padding: 6px 8px;
            text-align: left;
            vertical-align: top;
        }

        .feat-body th {
            background: #f7f2e9;
            color: var(--accent);
        }

        .aliases {
            margin: 0 0 8px;
            color: var(--muted);
            font-size: 0.84rem;
        }

        .empty {
            background: var(--paper);
            border: 1px dashed var(--line);
            border-radius: 10px;
            padding: 14px;
            color: var(--muted);
        }

        @media (max-width: 1000px) {
            .filters {
                grid-template-columns: 1fr;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <nav class="topnav">
            <a href="index.html">Accueil</a>
            <a href="historique.html">Historiques</a>
            <a href="races/index.html">Races</a>
            <a href="classes/index.html">Classes</a>
            <a href="dons.html">Dons</a>
            <a href="rules-2024.html">Règles</a>
            <a href="combat-2024.html">Combats</a>
            <a href="mastery-2024.html">Maîtrise</a>
            <a href="spells.html">Sorts</a>
            <a href="monstres.html">Monstres</a>
            <a href="character-sheet-standalone.html">Template</a>
            <a href="quickref.html">Référence rapide</a>
        </nav>

        <section class="hero">
            <h1>Dons D&amp;D 2024</h1>
            <p id="sourceNote">Chargement des dons...</p>
        </section>

        <section class="filters">
            <div>
                <label for="searchInput">Recherche</label>
                <input id="searchInput" type="text" placeholder="Ex: magie, bouclier, télépathie..." />
            </div>
            <div>
                <label for="categorySelect">Catégorie</label>
                <select id="categorySelect">
                    <option value="">Toutes</option>
                    <option value="Don d’origines">Don d’origines</option>
                    <option value="Don général">Don général</option>
                    <option value="Don de Style de combat">Don de Style de combat</option>
                    <option value="Don de faveur épique">Don de faveur épique</option>
                </select>
            </div>
            <div>
                <label for="prereqSelect">Prérequis</label>
                <select id="prereqSelect">
                    <option value="">Tous</option>
                    <option value="yes">Avec prérequis</option>
                    <option value="no">Sans prérequis</option>
                </select>
            </div>
            <div>
                <label for="repeatableSelect">Répétable</label>
                <select id="repeatableSelect">
                    <option value="">Tous</option>
                    <option value="yes">Répétables</option>
                    <option value="no">Non répétables</option>
                </select>
            </div>
            <div>
                <label for="sortSelect">Tri</label>
                <select id="sortSelect">
                    <option value="name_asc">Nom A-Z</option>
                    <option value="name_desc">Nom Z-A</option>
                    <option value="category_asc">Catégorie</option>
                    <option value="repeatable_desc">Répétables d'abord</option>
                    <option value="prereq_desc">Prérequis d'abord</option>
                </select>
            </div>
        </section>

        <div class="list-tools">
            <button id="expandAllBtn" type="button">Tout ouvrir</button>
            <button id="collapseAllBtn" type="button">Tout fermer</button>
        </div>
        <div id="summary" class="summary"></div>
        <div id="featsGrid" class="grid"></div>
    </div>

    <script src="data/feats_2024.js"></script>
    <script>
        (function () {
            const searchInput = document.getElementById("searchInput");
            const categorySelect = document.getElementById("categorySelect");
            const prereqSelect = document.getElementById("prereqSelect");
            const repeatableSelect = document.getElementById("repeatableSelect");
            const sortSelect = document.getElementById("sortSelect");
            const expandAllBtn = document.getElementById("expandAllBtn");
            const collapseAllBtn = document.getElementById("collapseAllBtn");
            const summary = document.getElementById("summary");
            const featsGrid = document.getElementById("featsGrid");
            const sourceNote = document.getElementById("sourceNote");

            const categoryOrder = {
                "Don d’origines": 0,
                "Don général": 1,
                "Don de Style de combat": 2,
                "Don de faveur épique": 3
            };

            let feats = [];

            function escapeHtml(value) {
                return String(value)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/\"/g, "&quot;")
                    .replace(/'/g, "&#39;");
            }

            function norm(value) {
                return String(value || "")
                    .toLowerCase()
                    .normalize("NFD")
                    .replace(/[\u0300-\u036f]/g, "");
            }

            function renderDescription(text) {
                const lines = String(text || "").split(/\r?\n/);
                const chunks = [];
                let i = 0;

                function renderParagraph(line) {
                    const match = line.match(/^([^.!?]{1,48}[.:])\s+(.+)$/);
                    if (match) {
                        return `<p><strong>${escapeHtml(match[1])}</strong> ${escapeHtml(match[2])}</p>`;
                    }
                    return `<p>${escapeHtml(line)}</p>`;
                }

                while (i < lines.length) {
                    const line = lines[i].trim();
                    if (!line) {
                        i += 1;
                        continue;
                    }

                    if (line.includes("\t")) {
                        const rows = [];
                        while (i < lines.length && lines[i].trim().includes("\t")) {
                            rows.push(lines[i].trim().split("\t"));
                            i += 1;
                        }
                        const [head, ...body] = rows;
                        chunks.push(
                            `<table><thead><tr>${head.map(cell => `<th>${escapeHtml(cell)}</th>`).join("")}</tr></thead>` +
                            `<tbody>${body.map(row => `<tr>${row.map(cell => `<td>${escapeHtml(cell)}</td>`).join("")}</tr>`).join("")}</tbody></table>`
                        );
                        continue;
                    }

                    chunks.push(renderParagraph(line));
                    i += 1;
                }

                return chunks.join("");
            }

            function applyFilters() {
                const query = norm(searchInput.value.trim());
                const category = categorySelect.value;
                const prereqMode = prereqSelect.value;
                const repeatableMode = repeatableSelect.value;

                const filtered = feats.filter(feat => {
                    if (category && feat.category !== category) return false;
                    if (prereqMode === "yes" && !feat.prerequis) return false;
                    if (prereqMode === "no" && feat.prerequis) return false;
                    if (repeatableMode === "yes" && !feat.repeatable) return false;
                    if (repeatableMode === "no" && feat.repeatable) return false;
                    if (!query) return true;

                    const haystack = norm([
                        feat.name,
                        (feat.aliases || []).join(" "),
                        feat.category,
                        feat.prerequis,
                        feat.repeatable ? "repetable" : "non repetable",
                        feat.description
                    ].join(" "));
                    return haystack.includes(query);
                });

                filtered.sort((a, b) => {
                    const mode = sortSelect.value;
                    if (mode === "name_desc") return b.name.localeCompare(a.name, "fr");
                    if (mode === "category_asc") {
                        return (categoryOrder[a.category] ?? 99) - (categoryOrder[b.category] ?? 99)
                            || a.name.localeCompare(b.name, "fr");
                    }
                    if (mode === "repeatable_desc") {
                        return Number(b.repeatable) - Number(a.repeatable)
                            || a.name.localeCompare(b.name, "fr");
                    }
                    if (mode === "prereq_desc") {
                        return Number(Boolean(b.prerequis)) - Number(Boolean(a.prerequis))
                            || a.name.localeCompare(b.name, "fr");
                    }
                    return a.name.localeCompare(b.name, "fr");
                });

                return filtered;
            }

            function card(feat) {
                const meta = [
                    feat.category,
                    feat.prerequis ? `Prérequis : ${feat.prerequis}` : "Aucun prérequis explicite",
                    feat.repeatable ? "Répétable" : "Non répétable"
                ];
                const aliases = feat.aliases && feat.aliases.length
                    ? `<p class="aliases"><strong>Alias :</strong> ${escapeHtml(feat.aliases.join(", "))}</p>`
                    : "";

                return `
                    <details class="feat">
                        <summary>
                            <header class="feat-head">
                                <h2 class="feat-title">${escapeHtml(feat.name)}</h2>
                                <div class="feat-meta">${escapeHtml(meta.join(" • "))}</div>
                            </header>
                        </summary>
                        <div class="feat-body">
                            ${aliases}
                            ${renderDescription(feat.description)}
                        </div>
                    </details>
                `;
            }

            function render() {
                const filtered = applyFilters();
                summary.textContent = `${filtered.length} don(s) affiché(s) sur ${feats.length}.`;
                if (!filtered.length) {
                    featsGrid.innerHTML = `<div class="empty">Aucun don ne correspond aux filtres actuels.</div>`;
                    return;
                }
                featsGrid.innerHTML = filtered.map(card).join("");
            }

            function setAllCards(open) {
                featsGrid.querySelectorAll("details.feat").forEach(el => {
                    el.open = open;
                });
            }

            function init(data) {
                feats = data.feats || [];
                sourceNote.textContent = data.note
                    ? `${data.count || feats.length} dons chargés. ${data.note}`
                    : `${data.count || feats.length} dons chargés.`;

                searchInput.addEventListener("input", render);
                categorySelect.addEventListener("change", render);
                prereqSelect.addEventListener("change", render);
                repeatableSelect.addEventListener("change", render);
                sortSelect.addEventListener("change", render);
                expandAllBtn.addEventListener("click", function () { setAllCards(true); });
                collapseAllBtn.addEventListener("click", function () { setAllCards(false); });
                render();
            }

            if (window.FEATS_DATA && window.FEATS_DATA.feats) {
                init(window.FEATS_DATA);
            } else {
                sourceNote.textContent = "Impossible de charger les données de dons.";
                featsGrid.innerHTML = `<div class="empty">Le fichier de données des dons est introuvable ou invalide.</div>`;
            }
        })();
    </script>
</body>
</html>
