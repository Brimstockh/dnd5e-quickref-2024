<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>D&D 2024 - Monstres</title>
    <link href="https://fonts.googleapis.com/css?family=Noto+Sans:400,700" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css?family=Lora:700" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/legacy-catalog.css" />
    <link rel="preload" href="data/monsters_2024.json" as="fetch" type="application/json" crossorigin="anonymous" />
    <script src="js/user-library.js" defer></script>
    <script src="js/site-shell.js" defer></script>
    <script src="js/catalog-ui.js" defer></script>
    <script src="js/legacy-catalog-ui.js" defer></script>
    <script src="js/progressive-list.js" defer></script>
    <script src="js/monster-export.js" defer></script>
    <script src="js/monsters-page.js" defer></script>
</head>
<body class="legacy-catalog-page" data-library-title="Monstres" data-library-category="Catalogue" data-library-description="Bestiaire D&D 2024">
    <header data-site-header data-active="monsters"></header>
    <div class="wrap">
        <nav class="topnav">
            <a href="index.html">Accueil</a>
            <a href="rules-2024.html">Règles</a>
            <a href="combat-2024.html">Combats</a>
            <a href="mastery-2024.html">Maîtrise</a>
            <a href="spells.html">Sorts</a>
            <a href="dons.html">Dons</a>
            <a href="quickref.html">Référence rapide</a>
        </nav>

        <section class="hero">
            <h1>Monstres D&D 2024</h1>
            <p id="sourceNote">Chargement des monstres...</p>
        </section>

        <section class="filters">
            <div>
                <label for="searchInput">Recherche</label>
                <input id="searchInput" type="search" data-page-search placeholder="Ex: dragon, zombie, perception..." />
            </div>
            <div>
                <label for="crSelect">FP</label>
                <select id="crSelect"><option value="">Tous</option></select>
            </div>
            <div>
                <label for="typeSelect">Type</label>
                <select id="typeSelect"><option value="">Tous</option></select>
            </div>
            <div>
                <label for="alignmentSelect">Alignement</label>
                <select id="alignmentSelect"><option value="">Tous</option></select>
            </div>
            <div>
                <label for="sizeSelect">Taille</label>
                <select id="sizeSelect"><option value="">Toutes</option></select>
            </div>
            <div>
                <label for="sortSelect">Tri</label>
                <select id="sortSelect">
                    <option value="cr_asc">FP croissant</option>
                    <option value="cr_desc">FP décroissant</option>
                    <option value="name_asc">Nom A-Z</option>
                    <option value="name_desc">Nom Z-A</option>
                    <option value="type_asc">Type A-Z</option>
                </select>
            </div>
        </section>

        <div class="list-tools">
            <span id="exportStatus" class="export-status" aria-live="polite"></span>
            <button id="expandAllBtn" type="button">Tout ouvrir</button>
            <button id="collapseAllBtn" type="button">Tout fermer</button>
            <button id="exportJsonBtn" type="button" disabled>Exporter (.json)</button>
        </div>
        <div id="summary" class="summary" role="status" aria-live="polite"></div>
        <div id="monstersGrid" class="grid"></div>
        <button class="progressive-load-more" id="loadMoreBtn" type="button" hidden></button>
    </div>
    <dialog id="monsterImageDialog" class="monster-image-dialog" aria-label="Illustration du monstre">
        <button class="monster-image-dialog-close" type="button" aria-label="Fermer l’illustration">×</button>
        <img id="monsterImageDialogImage" class="monster-image-dialog-image" alt="" />
    </dialog>
</body>
</html>
