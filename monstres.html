<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>D&D 2024 - Monstres</title>
    <link href="https://fonts.googleapis.com/css?family=Noto+Sans:400,700" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css?family=Lora:700" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --bg: #f1ece3;
            --paper: #fffef9;
            --ink: #222;
            --accent: #7a120f;
            --line: #d8d2c5;
            --muted: #5f5f5f;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Noto Sans", "Segoe UI", sans-serif;
            color: var(--ink);
            background: linear-gradient(160deg, #efe7d2 0%, #f8f5eb 45%, #ece6d8 100%);
        }

        .wrap {
            max-width: 1220px;
            margin: 0 auto;
            padding: 14px;
        }

        .topnav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .topnav a {
            text-decoration: none;
            border: 1px solid var(--accent);
            border-radius: 8px;
            color: var(--accent);
            background: #fff;
            padding: 7px 10px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .hero {
            background: var(--paper);
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .hero h1 {
            margin: 0 0 5px;
            color: var(--accent);
            font-family: "Lora", serif;
            font-size: 1.5rem;
        }

        .hero p {
            margin: 0;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .filters {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px;
            display: grid;
            gap: 8px;
            grid-template-columns: 2fr 1fr 1.2fr 1.2fr 1fr 1.2fr;
            margin-bottom: 10px;
        }

        .filters label {
            display: block;
            font-size: 0.74rem;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 4px;
            font-weight: 700;
            letter-spacing: 0.03em;
        }

        .filters input,
        .filters select {
            width: 100%;
            border: 1px solid #cabfae;
            border-radius: 8px;
            padding: 8px;
            font: inherit;
            background: #fff;
        }

        .summary {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .list-tools {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .list-tools button {
            border: 1px solid var(--accent);
            background: #fff;
            color: var(--accent);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 8px;
        }

        .monster {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 10px;
            overflow: hidden;
        }

        .monster-head {
            padding: 9px 10px;
            background: #f8f3f2;
            border-bottom: 1px solid var(--line);
        }

        details.monster > summary {
            list-style: none;
            cursor: pointer;
        }

        details.monster > summary::-webkit-details-marker {
            display: none;
        }

        details.monster > summary .monster-head {
            position: relative;
            padding-right: 34px;
        }

        details.monster > summary .monster-head::after {
            content: "+";
            position: absolute;
            right: 10px;
            top: 10px;
            color: var(--accent);
            font-weight: 700;
            font-size: 1.05rem;
            line-height: 1;
        }

        details.monster[open] > summary .monster-head::after {
            content: "-";
        }

        .monster-title {
            margin: 0;
            color: var(--accent);
            font-family: "Lora", serif;
            font-size: 1rem;
        }

        .monster-meta {
            color: var(--muted);
            font-size: 0.85rem;
            margin-top: 3px;
        }

        .monster-body {
            padding: 9px 10px;
            font-size: 0.9rem;
            line-height: 1.35;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 6px;
            margin-bottom: 8px;
        }

        .stat {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff;
            padding: 7px;
            min-width: 0;
        }

        .stat strong {
            display: block;
            color: var(--accent);
            font-size: 0.76rem;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .monster-lines {
            margin: 0;
            color: #333;
        }

        .monster-lines strong {
            color: var(--accent);
        }

        .empty {
            background: var(--paper);
            border: 1px dashed var(--line);
            border-radius: 10px;
            padding: 18px;
            color: var(--muted);
        }

        @media (max-width: 920px) {
            .filters { grid-template-columns: 1fr 1fr; }
        }

        @media (max-width: 640px) {
            .wrap { padding: 10px; }
            .filters { grid-template-columns: 1fr; }
            .grid { grid-template-columns: 1fr; }
            .stat-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <nav class="topnav">
            <a href="index.html">Accueil</a>
            <a href="rules-2024.html">Règles</a>
            <a href="combat-2024.html">Combats</a>
            <a href="mastery-2024.html">Maîtrise</a>
            <a href="spells.html">Sorts</a>
            <a href="dons.html">Dons</a>
            <a href="quickref.html">Référence rapide</a>
        </nav>

        <section class="hero">
            <h1>Monstres D&D 2024</h1>
            <p id="sourceNote">Chargement des monstres...</p>
        </section>

        <section class="filters">
            <div>
                <label for="searchInput">Recherche</label>
                <input id="searchInput" type="text" placeholder="Ex: dragon, zombie, perception..." />
            </div>
            <div>
                <label for="crSelect">CR</label>
                <select id="crSelect"><option value="">Tous</option></select>
            </div>
            <div>
                <label for="typeSelect">Type</label>
                <select id="typeSelect"><option value="">Tous</option></select>
            </div>
            <div>
                <label for="alignmentSelect">Alignement</label>
                <select id="alignmentSelect"><option value="">Tous</option></select>
            </div>
            <div>
                <label for="sizeSelect">Taille</label>
                <select id="sizeSelect"><option value="">Toutes</option></select>
            </div>
            <div>
                <label for="sortSelect">Tri</label>
                <select id="sortSelect">
                    <option value="cr_asc">CR croissant</option>
                    <option value="cr_desc">CR décroissant</option>
                    <option value="name_asc">Nom A-Z</option>
                    <option value="name_desc">Nom Z-A</option>
                    <option value="type_asc">Type A-Z</option>
                </select>
            </div>
        </section>

        <div class="list-tools">
            <button id="expandAllBtn" type="button">Tout ouvrir</button>
            <button id="collapseAllBtn" type="button">Tout fermer</button>
        </div>
        <div id="summary" class="summary"></div>
        <div id="monstersGrid" class="grid"></div>
    </div>

    <script src="data/monsters_2024.js"></script>
    <script>
        (function () {
            const searchInput = document.getElementById("searchInput");
            const crSelect = document.getElementById("crSelect");
            const typeSelect = document.getElementById("typeSelect");
            const alignmentSelect = document.getElementById("alignmentSelect");
            const sizeSelect = document.getElementById("sizeSelect");
            const sortSelect = document.getElementById("sortSelect");
            const expandAllBtn = document.getElementById("expandAllBtn");
            const collapseAllBtn = document.getElementById("collapseAllBtn");
            const summary = document.getElementById("summary");
            const monstersGrid = document.getElementById("monstersGrid");
            const sourceNote = document.getElementById("sourceNote");

            let monsters = [];

            function escapeHtml(value) {
                return String(value || "")
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#39;");
            }

            function norm(value) {
                return String(value || "").toLowerCase();
            }

            function option(value) {
                return `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`;
            }

            function uniqueValues(field) {
                return Array.from(new Set(monsters.map(m => m[field]).filter(Boolean)))
                    .sort((a, b) => String(a).localeCompare(String(b), "fr", { numeric: true }));
            }

            function fillSelect(select, values) {
                select.insertAdjacentHTML("beforeend", values.map(option).join(""));
            }

            function crLabel(monster) {
                const xp = monster.xp ? `, ${monster.xp} XP` : "";
                const pb = monster.pb ? `, PB ${monster.pb}` : "";
                return `CR ${monster.cr || "-"}${xp}${pb}`;
            }

            function applyFilters() {
                const query = norm(searchInput.value.trim());
                const cr = crSelect.value;
                const type = typeSelect.value;
                const alignment = alignmentSelect.value;
                const size = sizeSelect.value;

                const filtered = monsters.filter(monster => {
                    if (cr && monster.cr !== cr) return false;
                    if (type && monster.type !== type) return false;
                    if (alignment && monster.alignment !== alignment) return false;
                    if (size && monster.size !== size) return false;
                    if (!query) return true;
                    const haystack = norm([
                        monster.name,
                        monster.type,
                        monster.subtype,
                        monster.kind,
                        monster.size,
                        monster.alignment,
                        monster.cr,
                        monster.ac,
                        monster.hp,
                        monster.speed,
                        monster.skills,
                        monster.senses,
                        monster.languages,
                        monster.immunities,
                        monster.resistances,
                        monster.vulnerabilities
                    ].join(" "));
                    return haystack.includes(query);
                });

                filtered.sort((a, b) => {
                    const mode = sortSelect.value;
                    if (mode === "cr_desc") return b.cr_sort - a.cr_sort || a.name.localeCompare(b.name, "fr");
                    if (mode === "name_asc") return a.name.localeCompare(b.name, "fr");
                    if (mode === "name_desc") return b.name.localeCompare(a.name, "fr");
                    if (mode === "type_asc") return a.type.localeCompare(b.type, "fr") || a.name.localeCompare(b.name, "fr");
                    return a.cr_sort - b.cr_sort || a.name.localeCompare(b.name, "fr");
                });

                return filtered;
            }

            function line(label, value) {
                if (!value) return "";
                return `<p class="monster-lines"><strong>${escapeHtml(label)}.</strong> ${escapeHtml(value)}</p>`;
            }

            function card(monster) {
                const typeLine = [monster.kind || monster.type, monster.size, monster.alignment].filter(Boolean).join(" • ");
                const misc = [
                    line("Vitesse", monster.speed),
                    line("Compétences", monster.skills),
                    line("Sens", monster.senses),
                    line("Langues", monster.languages),
                    line("Immunités", monster.immunities),
                    line("Résistances", monster.resistances),
                    line("Vulnérabilités", monster.vulnerabilities)
                ].join("");

                return `
                    <details class="monster">
                        <summary>
                            <header class="monster-head">
                                <h2 class="monster-title">${escapeHtml(monster.name)}</h2>
                                <div class="monster-meta">${escapeHtml(typeLine)} • ${escapeHtml(crLabel(monster))}</div>
                            </header>
                        </summary>
                        <div class="monster-body">
                            <div class="stat-grid">
                                <div class="stat"><strong>CA</strong>${escapeHtml(monster.ac || "-")}</div>
                                <div class="stat"><strong>PV</strong>${escapeHtml(monster.hp || "-")}</div>
                                <div class="stat"><strong>Initiative</strong>${escapeHtml(monster.initiative || "-")}</div>
                            </div>
                            ${misc || "<p class=\"monster-lines\">Aucune information secondaire extraite.</p>"}
                        </div>
                    </details>
                `;
            }

            function render() {
                const filtered = applyFilters();
                summary.textContent = `${filtered.length} monstre(s) affiché(s) sur ${monsters.length}.`;
                if (!filtered.length) {
                    monstersGrid.innerHTML = `<div class="empty">Aucun monstre ne correspond aux filtres actuels.</div>`;
                    return;
                }
                monstersGrid.innerHTML = filtered.map(card).join("");
            }

            function setAllCards(open) {
                monstersGrid.querySelectorAll("details.monster").forEach(el => {
                    el.open = open;
                });
            }

            function init(data) {
                monsters = data.monsters || [];
                sourceNote.textContent = data.note
                    ? `${data.count || monsters.length} monstres chargés. ${data.note}`
                    : `${data.count || monsters.length} monstres chargés.`;

                fillSelect(crSelect, uniqueValues("cr").sort((a, b) => {
                    const am = monsters.find(m => m.cr === a);
                    const bm = monsters.find(m => m.cr === b);
                    return (am ? am.cr_sort : 0) - (bm ? bm.cr_sort : 0);
                }));
                fillSelect(typeSelect, uniqueValues("type"));
                fillSelect(alignmentSelect, uniqueValues("alignment"));
                fillSelect(sizeSelect, uniqueValues("size"));

                [searchInput, crSelect, typeSelect, alignmentSelect, sizeSelect, sortSelect].forEach(el => {
                    el.addEventListener("input", render);
                    el.addEventListener("change", render);
                });
                expandAllBtn.addEventListener("click", function () { setAllCards(true); });
                collapseAllBtn.addEventListener("click", function () { setAllCards(false); });
                render();
            }

            if (window.MONSTERS_DATA && window.MONSTERS_DATA.monsters) {
                init(window.MONSTERS_DATA);
            } else {
                sourceNote.textContent = "Impossible de charger les données de monstres.";
                monstersGrid.innerHTML = `<div class="empty">Le fichier data/monsters_2024.js est introuvable ou invalide.</div>`;
            }
        })();
    </script>
</body>
</html>
