<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>D&D 2024 - Monstres</title>
    <link href="https://fonts.googleapis.com/css?family=Noto+Sans:400,700" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css?family=Lora:700" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --bg: #f1ece3;
            --paper: #fffef9;
            --ink: #222;
            --accent: #7a120f;
            --line: #d8d2c5;
            --muted: #5f5f5f;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Noto Sans", "Segoe UI", sans-serif;
            color: var(--ink);
            background: linear-gradient(160deg, #efe7d2 0%, #f8f5eb 45%, #ece6d8 100%);
        }

        .wrap {
            max-width: 1220px;
            margin: 0 auto;
            padding: 14px;
        }

        .topnav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .topnav a {
            text-decoration: none;
            border: 1px solid var(--accent);
            border-radius: 8px;
            color: var(--accent);
            background: #fff;
            padding: 7px 10px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .hero {
            background: var(--paper);
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .hero h1 {
            margin: 0 0 5px;
            color: var(--accent);
            font-family: "Lora", serif;
            font-size: 1.5rem;
        }

        .hero p {
            margin: 0;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .filters {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px;
            display: grid;
            gap: 8px;
            grid-template-columns: 2fr 1fr 1.2fr 1.2fr 1fr 1.2fr;
            margin-bottom: 10px;
        }

        .filters label {
            display: block;
            font-size: 0.74rem;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 4px;
            font-weight: 700;
            letter-spacing: 0.03em;
        }

        .filters input,
        .filters select {
            width: 100%;
            border: 1px solid #cabfae;
            border-radius: 8px;
            padding: 8px;
            font: inherit;
            background: #fff;
        }

        .summary {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .list-tools {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .list-tools button {
            border: 1px solid var(--accent);
            background: #fff;
            color: var(--accent);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 8px;
        }

        .monster {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 10px;
            overflow: hidden;
        }

        .monster-head {
            padding: 9px 10px;
            background: #f8f3f2;
            border-bottom: 1px solid var(--line);
        }

        details.monster > summary {
            list-style: none;
            cursor: pointer;
        }

        details.monster > summary::-webkit-details-marker {
            display: none;
        }

        details.monster > summary .monster-head {
            position: relative;
            padding-right: 34px;
        }

        details.monster > summary .monster-head::after {
            content: "+";
            position: absolute;
            right: 10px;
            top: 10px;
            color: var(--accent);
            font-weight: 700;
            font-size: 1.05rem;
            line-height: 1;
        }

        details.monster[open] > summary .monster-head::after {
            content: "-";
        }

        .monster-title {
            margin: 0;
            color: var(--accent);
            font-family: "Lora", serif;
            font-size: 1rem;
        }

        .monster-meta {
            color: var(--muted);
            font-size: 0.85rem;
            margin-top: 3px;
        }

        .monster-body {
            padding: 9px 10px;
            font-size: 0.9rem;
            line-height: 1.35;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 6px;
            margin-bottom: 8px;
        }

        .stat {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff;
            padding: 7px;
            min-width: 0;
        }

        .stat strong {
            display: block;
            color: var(--accent);
            font-size: 0.76rem;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .monster-lines {
            margin: 0;
            color: #333;
        }

        .monster-lines strong {
            color: var(--accent);
        }

        .empty {
            background: var(--paper);
            border: 1px dashed var(--line);
            border-radius: 10px;
            padding: 18px;
            color: var(--muted);
        }

        @media (max-width: 920px) {
            .filters { grid-template-columns: 1fr 1fr; }
        }

        @media (max-width: 640px) {
            .wrap { padding: 10px; }
            .filters { grid-template-columns: 1fr; }
            .grid { grid-template-columns: 1fr; }
            .stat-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <nav class="topnav">
            <a href="index.html">Accueil</a>
            <a href="rules-2024.html">Règles</a>
            <a href="combat-2024.html">Combats</a>
            <a href="mastery-2024.html">Maîtrise</a>
            <a href="spells.html">Sorts</a>
            <a href="dons.html">Dons</a>
            <a href="quickref.html">Référence rapide</a>
        </nav>

        <section class="hero">
            <h1>Monstres D&D 2024</h1>
            <p id="sourceNote">Chargement des monstres...</p>
        </section>

        <section class="filters">
            <div>
                <label for="searchInput">Recherche</label>
                <input id="searchInput" type="text" placeholder="Ex: dragon, zombie, perception..." />
            </div>
            <div>
                <label for="crSelect">FP</label>
                <select id="crSelect"><option value="">Tous</option></select>
            </div>
            <div>
                <label for="typeSelect">Type</label>
                <select id="typeSelect"><option value="">Tous</option></select>
            </div>
            <div>
                <label for="alignmentSelect">Alignement</label>
                <select id="alignmentSelect"><option value="">Tous</option></select>
            </div>
            <div>
                <label for="sizeSelect">Taille</label>
                <select id="sizeSelect"><option value="">Toutes</option></select>
            </div>
            <div>
                <label for="sortSelect">Tri</label>
                <select id="sortSelect">
                    <option value="cr_asc">FP croissant</option>
                    <option value="cr_desc">FP décroissant</option>
                    <option value="name_asc">Nom A-Z</option>
                    <option value="name_desc">Nom Z-A</option>
                    <option value="type_asc">Type A-Z</option>
                </select>
            </div>
        </section>

        <div class="list-tools">
            <button id="expandAllBtn" type="button">Tout ouvrir</button>
            <button id="collapseAllBtn" type="button">Tout fermer</button>
        </div>
        <div id="summary" class="summary"></div>
        <div id="monstersGrid" class="grid"></div>
    </div>

    <script src="data/monsters_2024.js"></script>
    <script src="js/monsters-page.js"></script>
</body>
</html>
